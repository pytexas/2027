{% extends "main.html" %}
<!-- Remove side nav bar on large screens on desktop -->
{% block header %}
  {{ super() }}

  <!-- Additional styles for landing page -->
  <style>

    /* Hide table of contents */
    @media screen and (min-width: 60em) {
      .md-sidebar--secondary {
        display: none;
      }
    }

    /* Hide navigation */
    @media screen and (min-width: 76.25em) {
      .md-sidebar--primary {
        display: none;
      }
    }

    /* Keep a small gap between the hero and the page heading */
    .md-main {
      padding-top: 0.25rem !important;
    }
</style>
{% endblock %}
{% block hero %}
<div class="pytx-hero pytx-container">
    <div class="pytx-hero__image">
      <img src="assets/images/logos/pytexas2027_logo.svg" alt="PyTexas 2027 logo: a prickly pear cactus and an agave in front of the Texas sun"/>
    </div>
    <div class="pytx-hero__content">
      <a href="https://pretalx.com/pytexas-2027/" class="pytx-button pytx-button--primary">
        Submit to our CFP
      </a>
    </div>
    <figcaption>Thank you to <a href="https://www.olaurel.dev/">Olivia Laurel</a> for designing the 2027 logo and its colors.</figcaption>
</div>
{% endblock %}
{% block content %}
    <div style="text-align: center;">
        {% include "partials/content.html" %}
    </div>
{% endblock %}
